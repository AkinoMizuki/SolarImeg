name: 画像更新

on:
  schedule:
    - cron: '20 * * * *'  # 毎時20分に実行
  workflow_dispatch:      # 手動実行を可能にする

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
 
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 既存画像処理の依存関係をインストール
        run: |
          npm install js-yaml sharp

      - name: 既存画像の更新スクリプトを実行
        run: |
          node update_images.mjs

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: weather/requirements.txt

      - name: 気象データ処理の依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r weather/requirements.txt
          python -m eccodes selfcheck

      - name: 雲・風向風速テクスチャを更新
        run: |
          python weather/update_weather.py

      - name: index.html を生成
        run: |
          TIMESTAMP=$(date '+%s')
          echo '<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>画像一覧</title>
          </head>
          <body>
              <h1>画像一覧</h1>
              <ul>
              　　　<p>SOHO</p>
                  <li><img src="latest.jpg?'$TIMESTAMP'" alt="latest.jpg"></li>
                  <li><img src="latest2.jpg?'$TIMESTAMP'" alt="latest2.jpg"></li>
                  <li><img src="EIT171.jpg?'$TIMESTAMP'" alt="EIT171.jpg"></li>
                  <li><img src="LASCO_C2.jpg?'$TIMESTAMP'" alt="LASCO_C2.jpg"></li>
                   <p>Earth Weather</p>
                  <li><a href="weather/cloud_previous.png?'$TIMESTAMP'">weather/cloud_previous.png</a></li>
                  <li><a href="weather/cloud_current.png?'$TIMESTAMP'">weather/cloud_current.png</a></li>
                  <li><a href="weather/wind_surface.png?'$TIMESTAMP'">weather/wind_surface.png</a></li>
                  <li><a href="weather/wind_850hpa.png?'$TIMESTAMP'">weather/wind_850hpa.png</a></li>
                  <li><a href="weather/wind_700hpa.png?'$TIMESTAMP'">weather/wind_700hpa.png</a></li>
                  <li><a href="weather/metadata.json?'$TIMESTAMP'">weather/metadata.json</a></li>
                   <p>名古屋市科学館からの太陽像</p>
                  <li><img src="now_wh.jpg?'$TIMESTAMP'" alt="now_wh.jpg"></li>
                  <li><img src="now_ha.jpg?'$TIMESTAMP'" alt="now_ha.jpg"></li>
                   <p>live-cloud-maps</p>
                  <li><img src="clouds.jpg?'$TIMESTAMP'" alt="clouds.jpg"></li>
                  <li><img src="specular.jpg?'$TIMESTAMP'" alt="specular.jpg"></li>
              </ul>
              <p>最終更新日時: '$(date '+%Y-%m-%d %H:%M:%S')'</p>
          </body>
          </html>' > _site/index.html

      - name: GitHub Pages 用のデータをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: デプロイ
        uses: actions/deploy-pages@v4
